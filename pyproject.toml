[project]
name = "neer"
version = "0.1.0"
description = "NEER - agentic AI leak detective for city water networks (HackSprint'26, SC-02)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "wntr>=1.5",
  "numpy>=1.26",
  "pandas>=2.0",
  "networkx>=3.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.0",
  "mcp>=1.20",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain-core>=1.0",
  "langchain-mcp-adapters>=0.3",
  "langchain-groq>=1.0",
  "langchain-google-genai>=4.0",
  "langchain-ollama>=1.0",
  "streamlit>=1.40",
  "plotly>=6.0",
  "fpdf2>=2.8.9",
  "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical tests that take longer"]
addopts = "-q"
